<link rel="stylesheet" href="assets/overlay/info/style.css">
<section class="block">
    <h2 class="title lang" lang="overlay-info-basic">Software Info</h2>
    <ul class="options">
        <li class="item">
            <h3 class="title lang" lang="overlay-info-cv">Current Version</h3>
            <span>12.4.7</span>
        </li>
        <li class="item">
            <h3 class="title lang" lang="overlay-info-lv">Latest Version</h3>
            <span>12.4.7</span>
        </li>
        <li class="item">
            <h3 class="title lang" lang="overlay-info-date">Release Date</h3>
            <span>2024-07-02</span>
        </li>
    </ul>
</section>
<section class="block">
    <h2 class="title lang" lang="overlay-info-general">General Settings</h2>
    <ul class="options">
        <li class="item">
            <h3 class="title lang" lang="overlay-info-report">Upload Crash reports</h3>
            <input tabindex="-1" class="switch" type="checkbox">
        </li>
    </ul>
</section>
<section class="block">
    <h2 class="title lang" lang="overlay-info-lang">Language</h2>
    <ul class="options">
        <li class="item">
            <h3 class="title">繁體中文</h3>
            <input tabindex="-1" class="checkbox" type="radio" name="language" lang="tw">
        </li>
        <li class="item">
            <h3 class="title">简体中文</h3>
            <input tabindex="-1" class="checkbox" type="radio" name="language" lang="cn">
        </li>
        <li class="item">
            <h3 class="title">English</h3>
            <input tabindex="-1" class="checkbox" type="radio" name="language" lang="en">
        </li>
    </ul>
</section>
<section class="block">
    <h2 class="title lang" lang="overlay-info-scale">Window Scaling</h2>
    <ul class="options">
        <li class="item">
            <button class="option-button scale-button" data-symbol="-">
                <img src="assets/media/illustration/Minus.svg" alt="">
            </button>
            <span class="scale-text" style="text-align: center;">100%</span>
            <button class="option-button scale-button" data-symbol="+">
                <img src="assets/media/illustration/Addition.svg" alt="">
            </button>
            <button class="reset-button scale-button lang" lang="overlay-info-reset">reset</button>
        </li>
    </ul>
</section>
<script src="assets/overlay/info/script.js"></script>
