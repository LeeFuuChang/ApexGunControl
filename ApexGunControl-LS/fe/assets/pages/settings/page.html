<link rel="stylesheet" href="assets/pages/settings/style.css">
<section class="container">
    <section class="category">
        <div class="adjustment" tooltip="page-settings-sens-tooltip">
            <h5 class="name lang" lang="page-settings-sens">Lang Placeholder</h5>
            <form action="javascript:void(0);">
                <input class="slider" type="range" min="1" max="20" step="0.1" value="5" path="settings.json" name="sensitivity">
                <input class="slider-input" type="text" value="5.0" decimals="1" path="settings.json" name="sensitivity">
            </form>
        </div>
        <div class="adjustment" tooltip="page-settings-fps-tooltip">
            <h5 class="name lang" lang="page-settings-fps">Lang Placeholder</h5>
            <form action="javascript:void(0);">
                <input class="slider" type="range" min="30" max="240" step="10" value="120" path="settings.json" name="frequency">
                <input class="slider-input" type="text" value="120" decimals="0" path="settings.json" name="frequency">
            </form>
        </div>
        <div class="adjustment" tooltip="page-settings-confidence-tooltip">
            <h5 class="name lang" lang="page-settings-confidence">Lang Placeholder</h5>
            <form action="javascript:void(0);">
                <input class="slider" type="range" min="50" max="80" step="1" value="80" path="settings.json" name="confidence">
                <input class="slider-input" type="text" value="80" decimals="0" places path="settings.json" name="confidence">
            </form>
        </div>
        <div class="adjustment" tooltip="page-settings-region-tooltip">
            <h5 class="name lang" lang="page-settings-region">Lang Placeholder</h5>
            <form action="javascript:void(0);">
                <div>
                    (
                    <input type="text" readonly path="settings.json" name="region-l" value="1023">
                    ,
                    <input type="text" readonly path="settings.json" name="region-t" value="819">
                    ,
                    <input type="text" readonly path="settings.json" name="region-r" value="1512">
                    ,
                    <input type="text" readonly path="settings.json" name="region-b" value="982">
                    )
                </div>
                <button class="region-button" type="button">
                    <img src="assets/media/illustration/Region.svg" alt="">
                </button>
            </form>
        </div>
        <div class="adjustment" tooltip="page-settings-floating-tooltip">
            <h5 class="name lang" lang="page-settings-floating">Lang Placeholder</h5>
            <input tabindex="-1" class="switch" type="checkbox" path="settings.json" name="floating">
        </div>
    </section>
</section>
<script src="assets/pages/settings/script.js"></script>
