<link rel="stylesheet" href="assets/main/pages/settings/style.css">
<section class="container">
    <section class="category">
        <div class="adjustment">
            <h5 class="name lang" lang="page-settings-sens">Game Sensitivity</h5>
            <form action="javascript:void(0);">
                <input class="slider" type="range" min="1" max="20" step="0.1" value="5" path="settings" name="sensitivity">
                <input class="slider-input" type="text" value="5.0" path="settings" name="sensitivity">
            </form>
        </div>
        <div class="adjustment">
            <h5 class="name lang" lang="page-settings-dps">Detects Per Second</h5>
            <form action="javascript:void(0);">
                <input class="slider" type="range" min="1" max="30" step="1" value="5" path="settings" name="dps">
                <input class="slider-input" type="text" value="5" path="settings" name="dps">
            </form>
        </div>
        <div class="adjustment">
            <h5 class="name lang" lang="page-settings-region">Detection Region</h5>
            <form action="javascript:void(0);">
                <input type="text" readonly path="settings" name="region">
                <button type="button">
                    <img src="assets/media/illustration/Region.svg" alt="">
                </button>
            </form>
        </div>
    </section>
</section>
<script src="assets/main/pages/settings/script.js"></script>
