<link rel="stylesheet" href="assets/main/pages/settings/style.css">
<section class="container">
    <section class="category">
        <div class="adjustment">
            <h5 class="name">Game Sensitivity</h5>
            <div class="input" type="range">
                <form class="part">
                    <input type="range" min="1" max="20" step="0.1" value="5">
                </form>
                <form class="part">
                    <input type="text" value="5.0">
                </form>
            </div>
        </div>
        <div class="adjustment">
            <h5 class="name">Detects / Second</h5>
            <div class="input" type="range">
                <form class="part">
                    <input type="range" min="1" max="60" step="1" value="30">
                </form>
                <form class="part">
                    <input type="text" value="30">
                </form>
            </div>
        </div>
    </section>
</section>
<script src="assets/main/pages/settings/script.js"></script>
