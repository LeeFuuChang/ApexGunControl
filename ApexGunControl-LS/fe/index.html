<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="http://code.jquery.com/ui/1.10.4/jquery-ui.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="assets/widgets/style.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div id="app" theme="dark" lang="tw">
        <div id="notify-container" style="z-index: 4000;"></div>
        <div id="controls" style="z-index: 3000;">
            <link rel="stylesheet" href="assets/controls/style.css">
            <button class="app-control-button" name="app-control-settings">
                <img src="assets/media/controls/Settings.svg" alt="">
            </button>
            <link rel="stylesheet" href="assets/controls/style.css">
            <button class="app-control-button" name="app-control-minimize">
                <img src="assets/media/controls/Minimize.svg" alt="">
            </button>
            <button class="app-control-button" name="app-control-close">
                <img src="assets/media/controls/Close.svg" alt="">
            </button>
            <script src="assets/controls/script.js"></script>
        </div>
        <section id="overlay" style="z-index: 2000; display: none;">
            <link rel="stylesheet" href="assets/overlay/style.css">
            <section id="overlay-container" name=""></section>
            <script src="assets/overlay/script.js"></script>
        </section>
        <aside>
            <img id="logo" src="assets/media/Header.png" alt="">
            <nav>
                <section>
                    <h2 class="title lang" lang="nav-title-menu">MENU</h2>
                    <div class="options">
                        <button class="side-button active" name="dashboard">
                            <div class="icon">
                                <img src="assets/media/navigations/Dashboard.svg" alt="">
                            </div>
                            <p class="lang" lang="navigation-dashboard">Dashboard</p>
                        </button>
                        <button class="side-button" name="performance">
                            <div class="icon">
                                <img src="assets/media/navigations/Performance.svg" alt="">
                            </div>
                            <p class="lang" lang="navigation-performance">Performance</p>
                        </button>
                        <button class="side-button" name="settings">
                            <div class="icon">
                                <img src="assets/media/navigations/Settings.svg" alt="">
                            </div>
                            <p class="lang" lang="navigation-settings">Settings</p>
                        </button>
                    </div>
                </section>
                <div class="seperator"></div>
                <section>
                    <h2 class="title lang" lang="nav-title-installation">installation</h2>
                    <div class="options">
                        <button class="side-button" name="guide">
                            <div class="icon">
                                <img src="assets/media/navigations/Guide.svg" alt="">
                            </div>
                            <p class="lang" lang="navigation-guide">Guide</p>
                        </button>
                        <button class="side-button" name="Config">
                            <div class="icon">
                                <img src="assets/media/navigations/Config.svg" alt="">
                            </div>
                            <p class="lang" lang="navigation-config">Config</p>
                        </button>
                    </div>
                </section>
            </nav>
            <button id="side-login-button" class="side-button active side-button-no-dot">
                <div class="icon">
                    <img src="assets/media/navigations/Login.svg" alt="">
                </div>
                <p class="lang" lang="navigation-login">Login</p>
            </button>
            <button id="side-logout-button" class="side-button danger side-button-no-dot" style="display: none;">
                <div class="icon">
                    <img src="assets/media/navigations/Logout.svg" alt="">
                </div>
                <p class="lang" lang="navigation-logout">Logout</p>
            </button>
        </aside>
        <main>
            <link rel="stylesheet" href="assets/main/style.css">
            <nav>
                <section>
                    <button class="main-nav-button active" name="dashboard">
                        <p class="lang" lang="navigation-dashboard">Dashboard</p>
                    </button>
                    <button class="main-nav-button" name="performance">
                        <p class="lang" lang="navigation-performance">Performance</p>
                    </button>
                    <button class="main-nav-button" name="settings">
                        <p class="lang" lang="navigation-settings">Settings</p>
                    </button>
                </section>
                <section>
                    <button class="main-nav-button" name="guide">
                        <p class="lang" lang="navigation-guide">Guide</p>
                    </button>
                    <button class="main-nav-button" name="config">
                        <p class="lang" lang="navigation-config">Config</p>
                    </button>
                </section>
            </nav>
            <section id="page" name=""></section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="assets/language.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/index.js"></script>
</body>
</html>
